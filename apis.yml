aid: world-golf-tour
name: World Golf Tour
description: World Golf Tour (WGT Golf), operated by World Golf Tour, LLC out of San
  Francisco, is a free-to-play online golf simulation launched in 2008 that recreates
  more than twenty real championship courses like Pebble Beach, St Andrews, and Bethpage
  Black using photorealistic imagery, played by over 15 million players on web, iOS,
  and Android, with virtual equipment from Callaway, Titleist, and TaylorMade and
  integrations with SkyTrak launch monitors. The company is a Battery Ventures portfolio
  company and publishes no public developer API surface.
